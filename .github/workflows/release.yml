name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package framework-dependent Windows release
        shell: pwsh
        run: ./scripts/package-windows-release.ps1 -Tag $env:GITHUB_REF_NAME -Commit $env:GITHUB_SHA

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bass Note Finder ${{ github.ref_name }}
          body: |
            ## Download

            The Windows x64 ZIP requires the Microsoft .NET Desktop Runtime 10.x (x64).
            If it is missing, BassNoteFinder.exe shows a .NET download prompt.
            You can also [download the Desktop Runtime from Microsoft](https://dotnet.microsoft.com/download/dotnet/10.0).

            See `THIRD-PARTY-NOTICES.txt` in the ZIP for dependency licenses.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/BassNoteFinder-${{ github.ref_name }}-win-x64-framework-dependent.zip
